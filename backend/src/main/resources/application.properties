# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=assetmanagement
server.port=${PORT:8080}

# Optional local environment file (never committed to Git)
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database Configuration (MySQL / Cloud Database)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:military_asset_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Security / JWT Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:c2VjdXJlX21pbGl0YXJ5X2Fzc2V0X21hbmFnZW1lbnRfc3lzdGVtX2tleV8yMDI2X2FneV9zZWN1cmVfc2VjcmV0X2tleQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
